<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma journée</title>
<meta name="description" content="Mon tableau de bord personnel : tâche n°1, rendez-vous, sport et habitudes du jour.">
<meta name="theme-color" content="#F6F2EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#182028" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ma journée">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* ---------- Couleurs (mode clair, puis mode sombre automatique) ---------- */
:root {
  --bg: #F6F2EA;
  --surface: #FFFDF8;
  --surface-2: #F0EBE1;
  --line: #E4DDCF;
  --text: #2F3B47;
  --muted: #66717C;
  --accent: #6F8F72;
  --accent-strong: #4F6F53;
  --on-accent: #FFFFFF;
  --accent-soft: #E6EDE2;
  --rdv: #4F6B83;
  --rdv-soft: #E2E9EF;
  --sport: #9C5B3C;
  --sport-soft: #F4E5DB;
  --danger: #A0463A;
  --overlay: rgba(28, 36, 44, .42);
  --shadow: 0 1px 2px rgba(47, 59, 71, .05), 0 6px 18px rgba(47, 59, 71, .05);
  --radius: 18px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #182028;
    --surface: #202A33;
    --surface-2: #29343F;
    --line: #34414D;
    --text: #E8E3D9;
    --muted: #A1AAB3;
    --accent: #93B396;
    --accent-strong: #A9C6AB;
    --on-accent: #15201A;
    --accent-soft: rgba(147, 179, 150, .15);
    --rdv: #A9C0D4;
    --rdv-soft: rgba(169, 192, 212, .13);
    --sport: #E2AC91;
    --sport-soft: rgba(226, 172, 145, .13);
    --danger: #E59C91;
    --overlay: rgba(0, 0, 0, .55);
    --shadow: none;
    color-scheme: dark;
  }
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.small { font-size: 14px; }
.muted { color: var(--muted); }
.hidden { display: none !important; }
ul { list-style: none; margin: 0; padding: 0; }
h1, h2, h3, p { margin: 0; }

/* ---------- En-tête ---------- */
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 8px 0 18px;
}
.top-date .greet { font-size: 15px; color: var(--muted); }
.top-date h1 { font-size: 26px; font-weight: 650; letter-spacing: -.01em; line-height: 1.2; }
.top-actions { display: flex; gap: 8px; flex-shrink: 0; }

/* ---------- Mise en page ---------- */
.grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.col { display: grid; gap: 16px; align-content: start; min-width: 0; }
@media (min-width: 820px) {
  .grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .full { grid-column: 1 / -1; }
  .top-date h1 { font-size: 30px; }
}

/* ---------- Cartes ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  min-width: 0;
}
.card-top { background: var(--accent-soft); border-color: transparent; padding: 20px; }
.sec-h {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 12px;
}
.sec-h .count { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 14px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.dot-rdv { background: var(--rdv); }
.dot-sport { background: var(--sport); }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 9px 16px;
  border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text);
  font-weight: 600; font-size: 16px; line-height: 1.2; text-align: center;
}
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent-strong); color: var(--on-accent); border-color: transparent; }
.btn-primary:hover { border-color: transparent; filter: brightness(1.05); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--accent-strong); padding-left: 10px; padding-right: 10px; }
.btn-ghost:hover { border-color: transparent; text-decoration: underline; }
.btn-danger { color: var(--danger); }
.btn-sm { min-height: 38px; padding: 6px 12px; font-size: 15px; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
}
.icon-btn.plain { border-color: transparent; background: transparent; color: var(--muted); }
.icon-btn svg { width: 22px; height: 22px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

/* ---------- Formulaires ---------- */
.input {
  width: 100%; min-height: 46px;
  border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--text);
  padding: 10px 12px; font-size: 17px;
}
.input::placeholder { color: var(--muted); opacity: .8; }
select.input { appearance: auto; }
.row { display: flex; gap: 8px; align-items: stretch; }
.row > .input { flex: 1; min-width: 0; }
.stack { display: grid; gap: 10px; }
label.field { display: grid; gap: 4px; font-size: 14px; font-weight: 600; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; }
.seg span {
  display: inline-flex; align-items: center; min-height: 40px; padding: 6px 14px;
  border-radius: 999px; border: 1px solid var(--line); font-size: 15px; font-weight: 600; color: var(--muted);
}
.seg input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.seg input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- Pastilles et barres ---------- */
.pill {
  display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px;
  font-size: 13px; font-weight: 700; background: var(--surface-2); color: var(--muted); white-space: nowrap;
}
.pill-accent { background: var(--accent-soft); color: var(--accent-strong); }
.card-top .pill-accent { background: var(--surface); }
.pill-rdv { background: var(--rdv-soft); color: var(--rdv); }
.pill-sport { background: var(--sport-soft); color: var(--sport); }
.bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.card-top .bar { background: rgba(127, 127, 127, .16); }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }

/* ---------- Cases à cocher ---------- */
.check {
  display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; flex-shrink: 0; padding: 0;
  border: 0; background: transparent;
}
.check .ui, .slot .ui {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--accent); background: transparent;
  display: inline-flex; align-items: center; justify-content: center; color: transparent;
}
.check[aria-checked="true"] .ui, .slot[aria-checked="true"] .ui { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-accent); }
.check .ui svg, .slot .ui svg { width: 16px; height: 16px; }

/* ---------- Tâche n°1 ---------- */
.top-title { font-size: 24px; font-weight: 650; line-height: 1.25; letter-spacing: -.01em; overflow-wrap: anywhere; }
.next-step { margin-top: 14px; display: grid; gap: 6px; }
.next-step .next-text { font-size: 19px; font-weight: 600; overflow-wrap: anywhere; }
.card-top .bar { margin-top: 14px; }
.lead { font-size: 19px; font-weight: 600; margin-bottom: 12px; }
.pick { display: grid; gap: 8px; margin-bottom: 10px; }
.pick .btn { justify-content: flex-start; text-align: left; }

/* ---------- Rendez-vous ---------- */
.ev { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.ev:first-child { border-top: 0; padding-top: 2px; }
.ev-time { width: 64px; flex-shrink: 0; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--rdv); }
.ev-body { flex: 1; min-width: 0; }
.ev-title { font-weight: 600; overflow-wrap: anywhere; }
.meta { font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-top: 2px; }
.ev.past { opacity: .5; }
.ev.next, .ev.now { background: var(--rdv-soft); border-radius: 12px; border-top-color: transparent; padding: 10px; margin: 2px -10px; }
.ev.next + .ev, .ev.now + .ev { border-top-color: transparent; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 12px; font-size: 14px; color: var(--muted); }
.status .err { color: var(--danger); }
.empty { color: var(--muted); padding: 4px 0; }

/* ---------- Sport ---------- */
.sport-today { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--sport-soft); margin-bottom: 8px; }
.sport-type { font-size: 21px; font-weight: 700; color: var(--sport); overflow-wrap: anywhere; }
.sport-time { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.week { margin-top: 14px; display: grid; gap: 10px; }
.week-row { display: grid; grid-template-columns: minmax(96px, 1fr) auto 42px; align-items: center; gap: 10px; }
.week-row .lbl { font-weight: 600; overflow-wrap: anywhere; }
.dots { display: flex; gap: 6px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--sport); opacity: .35; }
.dots i.planned { opacity: 1; }
.dots i.done { opacity: 1; background: var(--sport); }
.week-row .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--sport); display: inline-block; }
.legend i.done { background: var(--sport); }

/* ---------- Habitudes ---------- */
.habit { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.habit:first-child { border-top: 0; padding-top: 0; }
.habit-info { flex: 1; min-width: 0; }
.habit-name { font-weight: 600; overflow-wrap: anywhere; }
.slots { display: flex; gap: 2px; flex-shrink: 0; }
.slot {
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-width: 46px; min-height: 48px; padding: 2px; border: 0; background: transparent;
}
.slot .lbl { font-size: 11px; color: var(--muted); font-weight: 600; }
.streak { color: var(--accent-strong); font-weight: 600; }

/* ---------- Tâches ---------- */
.task { border-top: 1px solid var(--line); }
.task:first-child { border-top: 0; }
.task-line { display: flex; align-items: center; gap: 4px; }
.task-main { flex: 1; min-width: 0; text-align: left; background: transparent; border: 0; padding: 8px 4px; min-height: 48px; }
.task-title { display: block; font-weight: 600; overflow-wrap: anywhere; }
.task.done .task-title { text-decoration: line-through; color: var(--muted); font-weight: 500; }
.task-more { padding: 0 0 12px 48px; }
.steps { display: grid; gap: 0; margin-bottom: 8px; }
.step { display: flex; align-items: center; gap: 2px; }
.step .check { width: 40px; height: 40px; }
.step .check .ui { width: 22px; height: 22px; }
.step span { overflow-wrap: anywhere; }
.step.done span { text-decoration: line-through; color: var(--muted); }
.list-foot { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

/* ---------- Capture ---------- */
.inbox { margin-top: 16px; }
.inbox h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.msg { display: flex; align-items: center; gap: 4px; border-top: 1px solid var(--line); }
.msg:first-of-type { border-top: 0; }
.msg-text { flex: 1; min-width: 0; padding: 8px 0; overflow-wrap: anywhere; }

/* ---------- Objectifs ---------- */
.goal + .goal { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
.goal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.goal-title { font-size: 20px; font-weight: 650; overflow-wrap: anywhere; }
.goal-prog { margin: 10px 0 14px; display: grid; gap: 6px; }
.zones { display: grid; gap: 8px; }
@media (min-width: 820px) { .zones { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } }
.zone { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); min-width: 0; }
.zone-btn { width: 100%; display: grid; gap: 8px; text-align: left; background: transparent; border: 0; padding: 12px 14px; min-height: 48px; }
.zone-top { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; }
.zone-top span:first-child { overflow-wrap: anywhere; }
.zone-top .num { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.zone-body { padding: 0 10px 12px; }
.zone-body .step { justify-content: space-between; }
.zone-body .step > span { flex: 1; }

/* ---------- Bandeau, fenêtres, messages ---------- */
.banner {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  background: var(--surface); border: 1px dashed var(--accent); border-radius: 14px;
  padding: 10px 14px; margin-bottom: 16px; font-size: 15px;
}
.banner p { flex: 1 1 220px; }
.overlay {
  position: fixed; inset: 0; z-index: 50; background: var(--overlay);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  background: var(--surface); width: 100%; max-width: 600px; max-height: 92vh; overflow-y: auto;
  border-radius: 22px 22px 0 0;
  padding: 18px 16px calc(20px + env(safe-area-inset-bottom));
  overscroll-behavior: contain;
}
@media (min-width: 640px) { .overlay { align-items: center; padding: 24px; } .sheet { border-radius: 22px; padding: 22px; } }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.sheet-h h2 { font-size: 21px; font-weight: 650; }
.sheet p + p { margin-top: 8px; }
.set { padding: 16px 0; border-top: 1px solid var(--line); }
.set:first-of-type { border-top: 0; padding-top: 4px; }
.set h3 { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.src { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; display: grid; gap: 8px; }
.src-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.src-name { font-weight: 700; overflow-wrap: anywhere; }
.cal-role { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 8px; align-items: center; font-size: 15px; }
.cal-role span { overflow-wrap: anywhere; }
.ok { color: var(--accent-strong); }
.err { color: var(--danger); }
.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  z-index: 80; max-width: calc(100% - 32px);
  background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 14px;
  font-weight: 600; font-size: 15px; box-shadow: 0 6px 24px rgba(0, 0, 0, .18);
  pointer-events: none;
}

/* ---------- Mode concentration ---------- */
.focus {
  position: fixed; inset: 0; z-index: 60; background: var(--bg); overflow-y: auto;
  display: flex; flex-direction: column; align-items: center;
  padding: max(20px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
}
.focus-in { width: 100%; max-width: 560px; display: grid; gap: 18px; text-align: center; margin: auto 0; }
.focus-close { position: absolute; top: max(12px, env(safe-area-inset-top)); right: 12px; }
.focus-task { color: var(--muted); font-weight: 600; overflow-wrap: anywhere; }
.focus-step { font-size: 26px; font-weight: 650; line-height: 1.25; overflow-wrap: anywhere; }
.timer { font-size: 76px; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1; }
.timer.over { color: var(--accent-strong); font-size: 34px; font-weight: 600; }
.durs { display: flex; justify-content: center; gap: 8px; }
.durs .btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.focus .actions { justify-content: center; margin-top: 0; }
.dnd { font-size: 15px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
.focus form { text-align: left; }

@media (prefers-reduced-motion: no-preference) {
  .btn, .check .ui, .slot .ui, .seg span { transition: background-color .15s, border-color .15s, color .15s; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-date">
      <div class="greet" id="greet">Bonjour</div>
      <h1 id="today">Aujourd'hui</h1>
    </div>
    <div class="top-actions">
      <button class="icon-btn" data-act="focus-open" aria-label="Mode concentration" title="Mode concentration">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M9.5 2.5h5"/></svg>
      </button>
      <button class="icon-btn" data-act="settings-open" aria-label="Réglages" title="Réglages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <div id="banner"></div>

  <main class="grid">
    <div class="col">
      <section class="card card-top" id="s-top" aria-label="Ma tâche n°1"></section>
      <section class="card" id="s-rdv" aria-label="Mes rendez-vous du jour"></section>
      <section class="card" id="s-sport" aria-label="Ma séance de sport"></section>
    </div>
    <div class="col">
      <section class="card" id="s-habits" aria-label="Mes habitudes du jour"></section>
      <section class="card" id="s-capture" aria-label="Capture rapide">
        <div class="sec-h"><span class="dot"></span>Capture rapide</div>
        <form data-form="capture">
          <div class="row">
            <input class="input" name="text" placeholder="Note-le, range-le plus tard" maxlength="200" autocomplete="off" required aria-label="Texte à noter">
            <button class="btn btn-primary">Noter</button>
          </div>
          <div class="seg" role="radiogroup" aria-label="Type">
            <label><input type="radio" name="kind" value="task" checked><span>Tâche</span></label>
            <label><input type="radio" name="kind" value="msg"><span>Message à traiter plus tard</span></label>
          </div>
        </form>
        <div id="inbox"></div>
      </section>
      <section class="card" id="s-tasks" aria-label="Mes tâches"></section>
    </div>
    <section class="card full" id="s-goals" aria-label="Objectifs longs"></section>
  </main>
</div>

<div id="modal"></div>
<div id="focus"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script>
(function () {
'use strict';

/* =====================================================================
   Outils
   ===================================================================== */
var KEY = 'ma-journee:donnees:v1';      // tâches, habitudes, objectifs, réglages
var KEY_CAL = 'ma-journee:agendas:v1';  // adresses des agendas (jamais exportées par défaut)

// --- Méthode « Script Google » (JSONP : fonctionne malgré les restrictions entre sites)
function jsonp(url, params) {
  return new Promise(function (resolve, reject) {
    var cb = '__maJournee' + Date.now() + Math.floor(Math.random() * 1e6);
    var s = document.createElement('script');
    var timer = setTimeout(function () { done(); reject(new Error('pas de réponse (délai dépassé)')); }, 25000);
    function done() { clearTimeout(timer); try { delete window[cb]; } catch (e) { window[cb] = undefined; } s.remove(); }
    window[cb] = function (data) { done(); resolve(data); };
    s.onerror = function () { done(); reject(new Error("chargement impossible. Vérifie l'adresse et que le script est déployé pour « Tout le monde »")); };
    var q = Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
    s.src = url + (url.indexOf('?') === -1 ? '?' : '&') + q + '&callback=' + cb;
    document.head.appendChild(s);

    return Promise.reject(new Error("l'adresse doit commencer par https://script.google.com/"));
  }
  return jsonp(src.url, { start: from.getTime(), end: to.getTime() }).then(function (data) {
    if (!data || !data.ok) throw new Error((data && data.error) || 'réponse inattendue du script');
    src.calendars = data.calendars || [];

      var start = e.allDay ? fromKey(e.start) : new Date(e.start);
      var end = e.allDay ? fromKey(e.end) : new Date(e.end);
      return { title: e.title || '(sans titre)', start: start.getTime(), end: end.getTime(), allDay: !!e.allDay, calendar: e.calendar || '' };
    });
  });
}

    if (!res.ok) throw new Error('erreur ' + res.status + ' (adresse incorrecte ou réinitialisée ?)');

        list.push({ id: src.id + '-' + i, title: e.title, start: new Date(e.start), end: new Date(e.end), allDay: e.allDay,
          calendar: e.calendar, role: roleOf(src, e.calendar) });
      });
    });
  }
  S.manual.forEach(function (m) {
    var d = fromKey(m.date), a = (m.start || '00:00').split(':'), b = (m.end || m.start || '00:00').split(':');
    list.push({ id: m.id, manual: true, title: m.title, role: 'rendez-vous', calendar: 'Ajouté à la main', allDay: !m.start,
      start: new Date(d.getFullYear(), d.getMonth(), d.getDate(), +a[0] || 0, +a[1] || 0),
      end: m.start ? new Date(d.getFullYear(), d.getMonth(), d.getDate(), +b[0] || 0, +b[1] || 0) : addDays(d, 1) });
  });
  return list;
}
function classify(ev) {
  var st = S.settings;
  if (ev.role === 'ignorer' || hasWord(ev.title, st.ignoreWords)) return { kind: 'ignore' };
  if (ev.role === 'routines') {
    var hids = S.habits.filter(function (h) { return hasWord(ev.title, h.words); }).map(function (h) { return h.id; });
    if (hids.length) return { kind: 'habit', habits: hids };
    if (hasWord(ev.title, st.hideWords)) return { kind: 'hidden' };
  }
  var keys = Object.keys(st.sport);
  for (var i = 0; i < keys.length; i++) {
    if (hasWord(ev.title, st.sport[keys[i]].words)) return { kind: 'sport', sport: keys[i] };
  }
  if ((ev.role === 'routines' || ev.role === 'sport') && hasWord(ev.title, st.restWords)) return { kind: 'rest' };
  if (ev.role === 'sport') return { kind: 'sport', sport: null };
  return { kind: 'rdv' };
}
function overlapsDay(ev, day) {
  var a = startOfDay(day), b = addDays(a, 1);
  return ev.start < b && (ev.end > a || (+ev.end === +ev.start && ev.start >= a));
}
function dayView() {
  var now = new Date(), today = startOfDay(now);
  var evs = allEvents().map(function (e) { e.c = classify(e); return e; }).filter(function (e) { return e.c.kind !== 'ignore'; });
  var todays = evs.filter(function (e) { return overlapsDay(e, today); }).sort(function (a, b) {
    if (a.allDay !== b.allDay) return a.allDay ? -1 : 1;
    return a.start - b.start;
  });
  var mon = startOfWeek(now), sun = addDays(mon, 7), week = {};
  Object.keys(S.settings.sport).forEach(function (k) { week[k] = { total: 0, done: 0 }; });
  evs.forEach(function (e) {
    if (e.c.kind === 'sport' && e.c.sport && e.start >= mon && e.start < sun) {
      week[e.c.sport].total++;
      if (e.end <= now) week[e.c.sport].done++;
    }
  });
  var habitTimes = {};
  todays.forEach(function (e) {
    if (e.c.kind === 'habit' && !e.allDay) e.c.habits.forEach(function (id) { (habitTimes[id] = habitTimes[id] || []).push(e.start); });
  });
  return {
    rdv: todays.filter(function (e) { return e.c.kind === 'rdv'; }),
    sport: todays.filter(function (e) { return e.c.kind === 'sport' || e.c.kind === 'rest'; }),
    week: week, habitTimes: habitTimes
  };
}

function slotLabels(n) {
  if (n === 3) return ['Matin', 'Midi', 'Soir'];
  if (n === 2) return ['Matin', 'Soir'];
  var a = []; for (var i = 1; i <= n; i++) a.push(n === 1 ? '' : String(i)); return a;
}
function habitDone(day, h) {
  var v = (S.habitLog[day] || {})[h.id];
  if (!v) return false;
  for (var i = 0; i < h.times; i++) if (!v[i]) return false;
  return true;
}
function streak(h) {
  var d = new Date(), n = 0;
  if (!habitDone(dayKey(d), h)) d = addDays(d, -1);
  while (n < 3650 && habitDone(dayKey(d), h)) { n++; d = addDays(d, -1); }
  return n;
}
function renderHabits(view) {

    var times = (view.habitTimes[h.id] || []).slice().sort(function (a, b) { return a - b; });
    if (h.times === 1 && times.length > 1) times = [times[times.length - 1]];
    var slots = labels.map(function (l, i) {

    }).join('');

    if (s > 0) meta.push('<span class="streak">' + s + ' j d\'affilée</span>');
    return '<li class="habit"><div class="habit-info"><div class="habit-name">' + esc(h.name) + '</div>' +

  }).join('');
  el.innerHTML = '<div class="sec-h"><span class="dot"></span>Mes habitudes du jour<span class="count">' + done + '/' + total + '</span></div>' +
    (rows ? '<ul>' + rows + '</ul>' : '<p class="empty">Aucune habitude. Ajoute-en dans les réglages.</p>');
}

function openSplit(t) {

var focusState = { open: false, minutes: 25, end: 0, left: 0, running: false, finished: false, tick: null, wake: null, audio: null };

function renderFocus() {
  var el = $('#focus');

    (focusState.finished ? '<div class="timer over" id="timer">Temps écoulé. Fais une pause.</div>' : '<div class="timer" id="timer" aria-live="off">' + fmtTimer(focusLeft()) + '</div>') +
    '<div class="durs">' + durs + '</div>' +
    '<div class="actions">' +
      (focusState.running ? '<button class="btn btn-primary" data-act="focus-pause">Pause</button>' : '<button class="btn btn-primary" data-act="focus-start">' + (focusState.left < focusState.minutes * 60000 && !focusState.finished ? 'Reprendre' : 'Démarrer') + '</button>') +
      '<button class="btn" data-act="focus-reset">Remettre à zéro</button>' +
      (t ? '<button class="btn" data-act="focus-step">' + (next ? 'Étape faite' : 'Tâche terminée') + '</button>' : '') +
    '</div>' +
    '<div class="dnd">Pense à activer le mode <strong>Ne pas déranger</strong> de ton téléphone : la page ne peut pas couper tes notifications elle-même.</div>' +
    '<form data-form="focus-note"><label class="field">Un message ou une idée qui te traverse l\'esprit ? Note-le pour plus tard :' +
    '<span class="row"><input class="input" name="text" maxlength="200" required placeholder="Répondre à…" autocomplete="off"><button class="btn">Noter</button></span></label></form>' +
    '</div></div>';
}
function focusTick() {
  var el = $('#timer');

  if (el && !focusState.finished) el.textContent = fmtTimer(left);
}
function focusFinish() {
  focusState.running = false; focusState.finished = true; focusState.left = 0;
  clearInterval(focusState.tick); releaseWake();
  try { if (navigator.vibrate) navigator.vibrate([250, 120, 250]); } catch (e) {}
  try {
    var ctx = focusState.audio;
    if (ctx) {
      [0, 0.35].forEach(function (d) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = 660; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.0001, ctx.currentTime + d);
        g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + d + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + d + 0.3);
        o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 0.32);

    }

}

  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (w) { focusState.wake = w; }).catch(function () {}); } catch (e) {}
}
function releaseWake() { try { if (focusState.wake) focusState.wake.release(); } catch (e) {} focusState.wake = null; }

  focusState.open = true;

}

function findTask(id) { return S.tasks.filter(function (t) { return t.id === id; })[0]; }

}
function completeTask(t) {

    var s = z && z.steps.filter(function (x) { return x.id === t.link.step; })[0];

}

    next.done = true;
    var after = t.steps.filter(function (s) { return !s.done; })[0];
    if (!after) { completeTask(t); toast('Bravo, tâche terminée !'); }
    else toast('Étape faite. Prochaine : ' + after.text);
  } else { completeTask(t); toast('Bravo, tâche terminée !'); }
}

function exportData() {

function importData(file) {

    if (!p || p.app !== 'ma-journee' || !p.data || p.data.v !== 1) { toast("Ce fichier ne vient pas de « Ma journée »."); return; }
    askConfirm('Remplacer les données de cet appareil par celles du fichier ?', 'Remplacer', function () {

    var g = findGoal(el.dataset.goal), z = findZone(g, el.dataset.zone); if (!z) return;
    var s = z.steps.filter(function (x) { return x.id === el.dataset.step; })[0]; if (!s) return;
    var t = S.tasks.filter(function (x) { return x.link && x.link.step === s.id && !x.done; })[0];
    if (!t) t = newTask(z.name + ' : ' + s.text, { goal: g.id, zone: z.id, step: s.id });
    S.topId = t.id; save(); render(); toast('Nouvelle tâche n°1'); window.scrollTo({ top: 0, behavior: 'smooth' });
  },
  'gstep-del': function (el) {
    var z = findZone(findGoal(el.dataset.goal), el.dataset.zone); if (!z) return;
    z.steps = z.steps.filter(function (x) { return x.id !== el.dataset.step; }); save(); renderGoals();
  },
  'zone-rename': function (el) {
    var z = findZone(findGoal(el.dataset.goal), el.dataset.zone); if (!z) return;
    askText('Renommer la zone', z.name, '', function (v) { z.name = v; save(); renderGoals(); });
  },
  'zone-delete': function (el) {
    var g = findGoal(el.dataset.goal), z = findZone(g, el.dataset.zone); if (!z) return;
    askConfirm('Supprimer la zone « ' + z.name + ' » et ses étapes ?', 'Supprimer', function () { g.zones = g.zones.filter(function (x) { return x !== z; }); save(); renderGoals(); });
  },
  'goal-add': function () {
    askText('Nouvel objectif long', '', 'ex. Préparer les vacances d\'été', function (v) { S.goals.push({ id: uid(), title: v, zones: [] }); save(); renderGoals(); });
  },
  'goal-menu': function (el) {
    var g = findGoal(el.dataset.id); if (!g) return;
    openModal('goal', '<div class="sheet-h"><h2>Modifier l\'objectif</h2><button class="icon-btn plain" data-act="close" aria-label="Fermer">' + ICON_X + '</button></div>' +
      '<form data-form="modal" class="stack"><label class="field">Titre<input class="input" name="v" value="' + esc(g.title) + '" required maxlength="100"></label>' +
      '<div class="actions"><button class="btn btn-primary">Enregistrer</button><button type="button" class="btn btn-ghost btn-danger" data-act="goal-delete" data-id="' + g.id + '">Supprimer l\'objectif</button></div></form>',
      function (f) { var v = f.v.value.trim(); if (v) { g.title = v; save(); renderGoals(); } });
  },
  'goal-delete': function (el) {
    var g = findGoal(el.dataset.id); if (!g) return;
    askConfirm('Supprimer l\'objectif « ' + g.title + ' » et toutes ses zones ?', 'Supprimer', function () { S.goals = S.goals.filter(function (x) { return x !== g; }); save(); renderGoals(); });
  },
  'src-del': function (el) {
    var src = CAL.sources.filter(function (s) { return s.id === el.dataset.id; })[0]; if (!src) return;
    askConfirm('Retirer l\'agenda « ' + src.name + ' » de cet appareil ?', 'Retirer', function () {
      CAL.sources = CAL.sources.filter(function (s) { return s !== src; }); delete CACHE.bySource[src.id];
      saveCal(); saveCache(); render(); openSettings();
    });
  },
  'habit-del': function (el) {
    var h = S.habits.filter(function (x) { return x.id === el.dataset.id; })[0]; if (!h) return;
    askConfirm('Supprimer l\'habitude « ' + h.name + ' » ?', 'Supprimer', function () { S.habits = S.habits.filter(function (x) { return x !== h; }); save(); render(); openSettings(); });
  },
  'export': function () { exportData(); },
  'reset-all': function () {
    askConfirm('Tout effacer sur cet appareil (tâches, habitudes, agendas) et revenir aux exemples ?', 'Tout effacer', function () {
      try { localStorage.removeItem(KEY); localStorage.removeItem(KEY_CAL); localStorage.removeItem(KEY_CACHE); } catch (e) {}
      S = exampleState(); CAL = { sources: [] }; CACHE = { bySource: {} }; save(); render(); toast('Tout est réinitialisé');
    });
  },
  'focus-open': function () { focusOpen(); },
  'focus-close': function () { focusState.open = false; renderFocus(); if (!modalKind) document.body.style.overflow = ''; },
  'focus-dur': function (el) {
    focusState.minutes = +el.dataset.m; focusState.running = false; focusState.finished = false;
    focusState.left = focusState.minutes * 60000; clearInterval(focusState.tick); releaseWake(); renderFocus();
  },
  'focus-start': function () {
    if (focusState.finished || focusState.left <= 0) { focusState.finished = false; focusState.left = focusState.minutes * 60000; }
    try { if (!focusState.audio) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) focusState.audio = new AC(); } else focusState.audio.resume(); } catch (e) {}
    focusState.end = Date.now() + focusState.left; focusState.running = true;
    clearInterval(focusState.tick); focusState.tick = setInterval(focusTick, 500);
    requestWake(); renderFocus();
  },
  'focus-pause': function () {
    focusState.left = focusLeft(); focusState.running = false; clearInterval(focusState.tick); releaseWake(); renderFocus();
  },
  'focus-reset': function () {
    focusState.running = false; focusState.finished = false; focusState.left = focusState.minutes * 60000;
    clearInterval(focusState.tick); releaseWake(); renderFocus();
  },
  'focus-step': function () { var t = topTask(); if (t) { advanceTop(t); save(); render(); } }
};

var FORMS = {
  'modal': function (f) { var cb = modalSubmit; closeModal(); if (cb) cb(f); },
  'capture': function (f) {
    var text = f.text.value.trim(); if (!text) return;
    var kind = (f.querySelector('input[name=kind]:checked') || {}).value;
    if (kind === 'msg') { S.inbox.push({ id: uid(), text: text, at: Date.now() }); toast('Noté dans « À répondre plus tard »'); }
    else { newTask(text); toast('Tâche ajoutée'); }
    f.text.value = ''; save(); render(); refocus = '#s-capture input[name=text]';
    var el = $(refocus); if (el) el.focus(); refocus = null;
  },
  'new-top': function (f) { var v = f.title.value.trim(); if (!v) return; var t = newTask(v); S.topId = t.id; save(); render(); },
  'focus-note': function (f) {
    var text = f.text.value.trim(); if (!text) return;
    S.inbox.push({ id: uid(), text: text, at: Date.now() }); save(); renderInbox();
    f.text.value = ''; toast('Noté pour plus tard. Reviens à ton étape.');
  },
  'gstep-add': function (f) {
    var z = findZone(findGoal(f.dataset.goal), f.dataset.zone); if (!z) return;
    var v = f.text.value.trim(); if (!v) return;
    z.steps.push({ id: uid(), text: v, done: false }); save();
    refocus = 'form[data-form="gstep-add"][data-zone="' + z.id + '"] input'; render();
  },
  'zone-add': function (f) {
    var g = findGoal(f.dataset.goal); if (!g) return;
    var v = f.name.value.trim(); if (!v) return;
    var z = { id: uid(), name: v, steps: [] }; g.zones.push(z); ui.openZones[z.id] = true; save();
    refocus = 'form[data-form="gstep-add"][data-zone="' + z.id + '"] input'; render();
  },
  'src-add': function (f) {
    var url = f.url.value.trim(), type = f.type.value;
    if (type === 'script' && !/^https:\/\/script\.google\.com\//.test(url)) { toast("Une adresse « Script Google » commence par https://script.google.com/"); return; }
    if (type === 'ical' && !/^(https|webcal):\/\//i.test(url)) { toast('Une adresse iCal commence par https://'); return; }
    CAL.sources.push({ id: uid(), name: f.name.value.trim() || 'Agenda', type: type, url: url, role: f.role.value });
    saveCal(); renderSettings(); refreshCalendars(true); toast('Agenda ajouté, lecture en cours…');
  },
  'sport': function (f) {
    var st = S.settings.sport;
    Object.keys(st).forEach(function (k) { st[k].words = splitWords(f['w_' + k].value); st[k].target = Math.max(0, Math.min(14, +f['t_' + k].value || 0)); });
    S.settings.restWords = splitWords(f.rest.value);
    save(); render(); toast('Enregistré');
  },
  'words': function (f) { S.settings.hideWords = splitWords(f.hide.value); S.settings.ignoreWords = splitWords(f.ignore.value); save(); render(); toast('Enregistré'); },
  'habit-edit': function (f) {
    var h = S.habits.filter(function (x) { return x.id === f.dataset.id; })[0]; if (!h) return;
    h.name = f.name.value.trim() || h.name; h.times = Math.max(1, Math.min(5, +f.times.value || 1)); h.words = splitWords(f.words.value);
    save(); render(); renderSettings(); toast('Habitude enregistrée');
  },
  'habit-add': function (f) {
    var v = f.name.value.trim(); if (!v) return;
    S.habits.push({ id: uid(), name: v, times: 1, words: [v] }); save(); render(); renderSettings(); toast('Habitude ajoutée');
  },
  'focus-set': function (f) { S.settings.focusMinutes = +f.m.value || 25; save(); toast('Enregistré'); }
};

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el) return;
  var fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (el.dataset.act !== 'overlay') ev.preventDefault();
  fn(el, ev);
});
document.addEventListener('submit', function (ev) {
  var f = ev.target, fn = FORMS[f.dataset.form];
  if (!fn) return;
  ev.preventDefault();
  fn(f);
});
document.addEventListener('change', function (ev) {
  var el = ev.target.closest('[data-change]');
  if (!el) return;
  var k = el.dataset.change;
  if (k === 'src-role') {
    var src = CAL.sources.filter(function (s) { return s.id === el.dataset.id; })[0];
    if (src) { src.role = el.value; saveCal(); render(); }
  } else if (k === 'cal-role') {
    S.settings.calendarRoles[el.dataset.name] = el.value; save(); render();
  } else if (k === 'import') {
    if (el.files && el.files[0]) importData(el.files[0]);
  }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Escape') return;
  if (modalKind) closeModal();
  else if (focusState.open) ACTIONS['focus-close']();
});

var toastTimer = null;
function toast(msg) {
  var el = $('#toast');
  el.textContent = msg; el.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.add('hidden'); }, 2600);
}

/* =====================================================================
   Démarrage
   ===================================================================== */
var currentDay = dayKey(new Date());
render();
refreshCalendars(true);
setInterval(function () {
  var k = dayKey(new Date());
  if (k !== currentDay) { currentDay = k; render(); refreshCalendars(true); }
  else if (!focusState.open) { var v = dayView(); renderRdv(v); renderSport(v); }
}, 60000);
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  if (Date.now() - ui.lastLoad > 15 * 60000) refreshCalendars(true); else render();
  if (focusState.running) requestWake();
});
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
})();
</script>
</body>
</html>
